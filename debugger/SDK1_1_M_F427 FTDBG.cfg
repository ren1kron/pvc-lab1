# SDK-1.1MC.427 / STM32F427VIT6.
source [file join [file dirname [info script]] SDK11M_FT.cfg]
set WORKAREASIZE 0x8000
transport select jtag
set CHIPNAME STM32F427VITx
set BOARDNAME SDK1_1_M
reset_config srst_only
set CONNECT_UNDER_RESET 1
source [find target/stm32f4x.cfg]
# Explicit equivalent of ST's CONNECT_UNDER_RESET for stock OpenOCD.
reset_config srst_only srst_nogate connect_assert_srst
# Verified on the SDK-1.1M FT2232 board: keep JTAG slow through programming.
# stm32f4x.cfg otherwise raises it to 8 MHz in reset-init, causing Invalid ACK.
# Leave the MCU on its reset HSI clock; the flash loader works at 16 MHz.
adapter speed 100
$_TARGETNAME configure -event reset-start { adapter speed 100 }
$_TARGETNAME configure -event reset-init { adapter speed 100 }
