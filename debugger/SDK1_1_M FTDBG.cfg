# SDK-1.1MC.407 / STM32F407VGT6. Not the F107 layout!
source [file join [file dirname [info script]] SDK11M_FT.cfg]
set WORKAREASIZE 0x8000
transport select jtag
set CHIPNAME STM32F407VGTx
set BOARDNAME SDK1_1_M
reset_config srst_only
set CONNECT_UNDER_RESET 1
source [find target/stm32f4x.cfg]
# Stock OpenOCD ignores ST's CONNECT_UNDER_RESET variable. Apply its documented
# equivalent explicitly after the target script (OpenOCD manual, Reset Configuration).
reset_config srst_only srst_nogate connect_assert_srst
